# ducal GNOME settings, applied with `dconf load /`.
# Colors (launcher, shell theme, wallpaper) are handled by `ducal theme`.

[org/gnome/desktop/interface]
color-scheme='prefer-dark'
cursor-theme='Vimix-white-cursors'
monospace-font-name='JetBrainsMono Nerd Font 11'

[org/gnome/desktop/wm/keybindings]
# Super+H belongs to Forge (focus left)
minimize=@as []
# Super+Q closes the focused window; Alt+F4 keeps working
close=['<Super>q', '<Alt>F4']
# Ctrl+Alt+D belongs to Forge (left third); Super+D still shows the desktop
show-desktop=['<Primary><Super>d', '<Super>d']
# Super+Space opens the launcher; Shift+Super+Space still switches keyboard layouts
switch-input-source=['XF86Keyboard']
# Numbered workspaces: Super+N goes to workspace N, Super+Shift+N sends the window there
switch-to-workspace-1=['<Super>1', '<Super>Home']
switch-to-workspace-2=['<Super>2']
switch-to-workspace-3=['<Super>3']
switch-to-workspace-4=['<Super>4']
move-to-workspace-1=['<Super><Shift>1', '<Super><Shift>Home']
move-to-workspace-2=['<Super><Shift>2']
move-to-workspace-3=['<Super><Shift>3']
move-to-workspace-4=['<Super><Shift>4']

[org/gnome/shell/keybindings]
# Super+V belongs to Forge (split vertically); Super+M still opens notifications
toggle-message-tray=['<Super>m']
# Super+number is only for workspaces: GNOME would open dock apps with it
switch-to-application-1=@as []
switch-to-application-2=@as []
switch-to-application-3=@as []
switch-to-application-4=@as []
switch-to-application-5=@as []
switch-to-application-6=@as []
switch-to-application-7=@as []
switch-to-application-8=@as []
switch-to-application-9=@as []

[org/gnome/mutter]
# Four fixed workspaces, so Super+1..4 always has a target
dynamic-workspaces=false

[org/gnome/desktop/wm/preferences]
num-workspaces=4

[org/gnome/settings-daemon/plugins/media-keys]
# Super+L belongs to Forge (focus right)
screensaver=['<Control><Alt>l']

[org/gnome/shell/extensions/dash-to-dock]
dock-position='BOTTOM'
dock-fixed=false
autohide=true
intellihide=false
extend-height=false
dash-max-icon-size=44
apply-custom-theme=false
custom-theme-shrink=true
transparency-mode='FIXED'
background-opacity=0.35
running-indicator-style='DOTS'
click-action='focus-minimize-or-previews'
scroll-action='cycle-windows'
show-apps-at-top=true
show-trash=false
show-mounts=false
multi-monitor=true
# The dock also grabs Super+1..9 to open apps
hot-keys=false
# Super+Q (show the dock with app numbers) belongs to closing windows
shortcut=@as []
shortcut-text=''
app-hotkey-1=@as []
app-hotkey-2=@as []
app-hotkey-3=@as []
app-hotkey-4=@as []
app-hotkey-5=@as []
app-hotkey-6=@as []
app-hotkey-7=@as []
app-hotkey-8=@as []
app-hotkey-9=@as []
app-hotkey-10=@as []

[org/gnome/shell/extensions/just-perfection]
panel-size=26
panel-button-padding-size=6
panel-indicator-padding-size=4
accessibility-menu=false

[org/gnome/shell/extensions/blur-my-shell/panel]
blur=false

[org/gnome/shell/extensions/blur-my-shell/dash-to-dock]
blur=true
static-blur=true
override-background=true
style-dash-to-dock=0

[org/gnome/shell/extensions/search-light]
# One accelerator per key: Search Light joins each list into a single shortcut
shortcut-search=['<Super>space']
secondary-shortcut-search=['<Control>space']
show-panel-icon=false
popup-at-cursor-monitor=true
blur-background=false
border-radius=0.0
border-thickness=2

# Numbered workspaces in the top bar (colors come from `ducal theme`)
[org/gnome/shell/extensions/space-bar/behavior]
always-show-numbers=true
show-empty-workspaces=true
smart-workspace-names=false

[org/gnome/shell/extensions/space-bar/appearance]
active-workspace-border-radius=0
inactive-workspace-border-radius=0
empty-workspace-border-radius=0

[org/gnome/shell/extensions/space-bar/shortcuts]
# GNOME already handles Super+1..4; Super+W belongs to Forge, Super+N to notifications
enable-activate-workspace-shortcuts=false
enable-move-to-workspace-shortcuts=false
open-menu=@as []
activate-empty-key=@as []
activate-previous-key=@as []

[org/gnome/shell/extensions/forge/keybindings]
# Ctrl+Alt+T opens the terminal, so the right two-thirds snap moves to Ctrl+Alt+R
window-snap-two-third-right=['<Ctrl><Alt>r']
