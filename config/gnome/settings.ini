# ducal GNOME settings, applied with `dconf load /`.
# Colors (launcher, shell theme, wallpaper) are handled by `ducal theme`.

[org/gnome/desktop/interface]
color-scheme='prefer-dark'
cursor-theme='Vimix-white-cursors'
monospace-font-name='JetBrainsMono Nerd Font 11'

[org/gnome/desktop/wm/keybindings]
# Super+H belongs to Forge (focus left)
minimize=@as []
# Super+Space opens the launcher; Shift+Super+Space still switches keyboard layouts
switch-input-source=['XF86Keyboard']

[org/gnome/settings-daemon/plugins/media-keys]
# Super+L belongs to Forge (focus right)
screensaver=['<Control><Alt>l']

[org/gnome/shell/extensions/dash-to-dock]
dock-position='BOTTOM'
dock-fixed=false
autohide=true
intellihide=false
extend-height=false
dash-max-icon-size=44
apply-custom-theme=false
custom-theme-shrink=true
transparency-mode='FIXED'
background-opacity=0.35
running-indicator-style='DOTS'
click-action='focus-minimize-or-previews'
scroll-action='cycle-windows'
show-apps-at-top=true
show-trash=false
show-mounts=false
multi-monitor=true

[org/gnome/shell/extensions/just-perfection]
panel-size=26
panel-button-padding-size=6
panel-indicator-padding-size=4
accessibility-menu=false

[org/gnome/shell/extensions/blur-my-shell/panel]
blur=false

[org/gnome/shell/extensions/blur-my-shell/dash-to-dock]
blur=true
static-blur=true
override-background=true
style-dash-to-dock=0

[org/gnome/shell/extensions/search-light]
shortcut-search=['<Super>space', '<Control>space']
show-panel-icon=false
popup-at-cursor-monitor=true
blur-background=false
border-radius=0.0
border-thickness=2
