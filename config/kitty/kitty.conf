# ducal kitty configuration
# Colors live in current-theme.conf, managed by `ducal theme`.

# --- Font ---
font_family      JetBrainsMono Nerd Font
font_size        11.0
bold_font        auto
italic_font      auto
bold_italic_font auto

# --- Window ---
# On GNOME the title bar buttons come from the window manager, not kitty.
hide_window_decorations no
window_padding_width    12
window_padding_height   12
remember_window_size    no
initial_window_width    100c
initial_window_height   30c
window_border_width     1pt
window_margin_width     4

# --- Cursor ---
cursor_shape            beam
cursor_blink_interval   0

# --- Subtle transparency (pairs with the Blur my Shell extension) ---
background_opacity      0.92
background_blur         1

# --- Scrolling ---
scrollback_lines        10000
wheel_scroll_multiplier 3.0

# --- URLs ---
url_style               curly
show_hyperlink_targets  yes

# --- Bell: visual only, no sound ---
enable_audio_bell       no
visual_bell_duration    0.0

# --- Tabs ---
tab_bar_edge            bottom
tab_bar_style           slant
tab_bar_min_tabs        2
tab_title_template      {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
active_tab_font_style   bold
inactive_tab_font_style normal

# --- Shortcuts ---
map ctrl+shift+plus     change_font_size all +1.0
map ctrl+shift+minus    change_font_size all -1.0
map ctrl+shift+0        change_font_size all 0
map ctrl+shift+t        new_tab
map ctrl+shift+w        close_tab
map ctrl+shift+right    next_tab
map ctrl+shift+left     previous_tab
map ctrl+shift+l        next_layout
map ctrl+shift+enter    new_window
map ctrl+shift+q        close_window
# Move between splits: Ctrl+Shift+A (left) and Ctrl+Shift+D (right)
map ctrl+shift+a        neighboring_window left
map ctrl+shift+d        neighboring_window right
map ctrl+shift+tab      nth_window -1

# --- Performance ---
repaint_delay           10
input_delay             3
sync_to_monitor         yes

# --- Shell ---
shell                   /usr/bin/fish

# --- Colors (managed by `ducal theme`) ---
include current-theme.conf
